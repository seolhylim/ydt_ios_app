name: iOS Final Signed Build (Universal Link Fixed)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/cap
          npx cap sync ios

      - name: Install Certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_P12 }}" | base64 -d > dev_cert.p12
          security create-keychain -p "123456" build.keychain
          security unlock-keychain -p "123456" build.keychain
          security import dev_cert.p12 -k build.keychain -P "${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}" -A
          security set-keychain-settings -lut 3600 build.keychain

      - name: Install Provisioning Profile & Get UUID
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i Dev_App_ydt.mobileprovision))
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          cp Dev_App_ydt.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      # 🚀 这里是关键：生成强制 entititlements
      - name: Generate Final Entitlements
        run: |
          cd ios/App
          cat > ent_final.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.associated-domains</key>
              <array>
                  <string>applinks:www.fllya.com</string>
              </array>
              <key>application-identifier</key>
              <string>7M6RRX3ZU6.com.app.ydt</string>
              <key>com.apple.developer.team-identifier</key>
              <string>7M6RRX3ZU6</string>
              <key>get-task-allow</key>
              <true/>
              <key>keychain-access-groups</key>
              <array>
                  <string>7M6RRX3ZU6.*</string>
                  <string>com.apple.token</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Xcode Build
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_DEVELOPER_TEAM_ID }} \
            PROVISIONING_PROFILE=${{ env.PROFILE_UUID }} \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGN_ENTITLEMENTS=ent_final.plist

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/Build/Intermediates.noindex/ArchiveIntermediates/App/BuildProductsPath/Release-iphoneos/App.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist ../../ExportOptions.plist \
            CODE_SIGN_ENTITLEMENTS=ent_final.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Final_IPA
          path: ios/App/output/App.ipa
